name: 合大通知监测

on:
  # 近实时监测由本机常驻进程负责（默认每 180 秒一轮）。
  # GitHub Actions 最快只能 5 分钟一跑且常排队延迟，这里不再设固定定时，
  # 避免与本机重复提醒；保留手动触发作为云端备份。
  workflow_dispatch:
    inputs:
      init:
        description: '填 true 表示重建基线（本次不推送）'
        required: false
        default: 'false'
      pages:
        description: '每个栏目抓取页数'
        required: false
        default: '2'

permissions:
  contents: write
  issues: write

concurrency:
  group: hfuu-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并整理通知
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HFUU_MAIL_USER: ${{ secrets.MAIL_USER }}
          HFUU_MAIL_PASS: ${{ secrets.MAIL_PASS }}
          HFUU_MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          PAGES="${{ github.event.inputs.pages || '2' }}"
          if [ "${{ github.event.inputs.init }}" = "true" ]; then
            python monitor.py --init --pages "$PAGES"
          else
            python monitor.py --pages "$PAGES"
          fi

      - name: 归档日报与去重状态
        run: |
          git config user.name "hfuu-monitor[bot]"
          git config user.email "hfuu-monitor[bot]@users.noreply.github.com"
          git add state/ reports/
          if git diff --staged --quiet; then
            echo "本次无文件变更"
          else
            git commit -m "chore: update monitor state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
